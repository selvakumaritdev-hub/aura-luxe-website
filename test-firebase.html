<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firebase test</title>
<style>body{font:15px system-ui;background:#0b0a09;color:#f4efe6;max-width:560px;margin:60px auto;padding:0 20px}button{background:#c9a96e;border:0;padding:14px 22px;border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}pre{background:#131110;border:1px solid #3a3226;padding:16px;border-radius:10px;white-space:pre-wrap;word-break:break-word;margin-top:20px}</style></head><body>
<h2>Firebase connection test</h2><p style="color:#a8a095">Click the button. It saves one test booking and shows the result here.</p>
<button id="b">Send test booking</button><pre id="o">Waiting…</pre>
<script src="js/firebase-config.js"></script><script src="js/cloud.js"></script>
<script>var o=document.getElementById('o');o.textContent='Config loaded: '+(window.AURA_FIREBASE?'yes ('+AURA_FIREBASE.projectId+')':'NO');
document.getElementById('b').onclick=function(){o.textContent='Sending…';auraSave('bookings',{name:'TEST Customer',phone:'+91 00000 00000',home:'Test Home',date:'Today',time:'Now',status:'Pending'}).then(function(r){o.textContent=r.ok?'SUCCESS ✓ Saved. Document id: '+r.id+'\nNow open Admin → Bookings.':'FAILED ✗\nReason: '+r.err+'\n\n(Also press F12 → Console for details.)'})}</script></body></html>
