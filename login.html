document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('lang',L);render()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;useOtp=false;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));$('mode-pw').style.display=tab=='in'?'':'none';$('mode-up').style.display=tab=='up'?'':'none';$('go-otp').style.display=tab=='in'?'':'none';render()});
document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.eye);i.type=i.type=='password'?'text':'password';render()});
document.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>show(a.dataset.go));
const score=p=>[p.length>=8,/[A-Z]/.test(p)&&/[a-z]/.test(p),/\d/.test(p),/[^\w\s]/.test(p)].filter(Boolean).length;
const paint=(p,m)=>{const s=score(p);document.querySelectorAll(m+' i').forEach((i,n)=>i.style.background=n<s?['#d9806f','#e0b25c','#c9a96e','#7fc8a0'][s-1]:'')};
$('pw2').oninput=e=>paint(e.target.value,'#meter');
const dest=()=>'account.html';
function finish(name,k){who=name||who||'Guest';const raw=($('id').value+' '+$('em').value+' '+who).trim().toLowerCase();localStorage.setItem('auraRole','customer');localStorage.setItem('auraUser',who);done=k;show('done');render();setTimeout(()=>location.href=dest(),2200)}
$('submit').onclick=()=>{$('id').classList.remove('err');
if(tab=='in'){const v=$('id').value.trim();if(!v||(!useOtp&&!$('pw').value))return msg('msg','eReq');if(!validId(v)){$('id').classList.add('err');return msg('msg','eId')}
if(useOtp){who=v;return sendCode(v,'otp')}
if($('pw').value.length<8)return msg('msg','ePw');finish(v.split('@')[0].replace(/^./,c=>c.toUpperCase()),'dIn')}
else{if(!$('nm').value.trim()||!$('em').value.trim()||!$('pw2').value)return msg('msg','eReq');if(!validId($('em').value.trim()))return msg('msg','eId');if($('pw2').value.length<8)return msg('msg','ePw');if(!$('terms').checked)return msg('msg','eTerms');finish($('nm').value.trim().split(' ')[0],'dUp')}};
$('go-otp').onclick=()=>{useOtp=!useOtp;$('mode-pw').querySelector('.f').parentNode.style.opacity=1;$('pw').closest('.f').style.display=useOtp?'none':'';$('pw').parentNode.previousElementSibling.style.display=useOtp?'none':'';$('submit').textContent=useOtp?t('sendCode'):t('signin')};
$('go-forgot').onclick=()=>show('forgot');
function sendCode(v,from){$('oto').textContent=v;show('otp');$('otp').children[0].focus();clearInterval(tm);let s=30;const tick=()=>{$('timer').textContent=s>0?t('sec')+' 0:'+String(s).padStart(2,'0'):'';$('resend').style.display=s>0?'none':''};tick();tm=setInterval(()=>{s--;tick();if(s<=0)clearInterval(tm)},1000);window._from=from}
$('sendOtp').onclick=()=>{const v=$('fid').value.trim();if(!validId(v))return msg('fm','eId');who=v;sendCode(v,'reset')};
$('resend').onclick=()=>sendCode($('oto').textContent,window._from);
const ob=[...$('otp').children];ob.forEach((b,n)=>{b.oninput=()=>{b.value=b.value.replace(/\D/g,'');if(b.value&&ob[n+1])ob[n+1].focus()};b.onkeydown=e=>{if(e.key=='Backspace'&&!b.value&&ob[n-1])ob[n-1].focus()};b.onpaste=e=>{const d=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);if(d){e.preventDefault();[...d].forEach((c,i)=>ob[i].value=c);ob[Math.min(d.length,5)].focus()}}});
$('verify').onclick=()=>{if(ob.map(b=>b.value).join('')!='123456')return msg('om','eCode');ob.forEach(b=>b.value='');if(window._from=='reset')show('reset');else finish(who.split('@')[0].replace(/^./,c=>c.toUpperCase()),'dIn')};
$('np').oninput=e=>{};
$('doReset').onclick=()=>{if($('np').value.length<8)return msg('rm','ePw');if($('np').value!=$('cp').value)return msg('rm','eMatch');finish(who.split('@')[0],'dRe')};
document.querySelectorAll('[data-soc]').forEach(b=>b.onclick=()=>{const o=b.textContent;b.textContent=t('soc');setTimeout(()=>{b.textContent=o;finish('Selvakumar','dIn')},900)});
$('goDash').onclick=()=>location.href=dest();
render();
</script></body></html>
